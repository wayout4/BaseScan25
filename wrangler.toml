name = "basegrid-safety-api"
main = "backend/src/index.js"
compatibility_date = "2026-10-12"
workers_dev = true

[triggers]
crons = ["*/1 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "basegrid-safety"
database_id = "REPLACE_WITH_D1_DATABASE_ID"

[vars]
SITE_ORIGIN = "https://wayout4.github.io"
BASE_RPC_URL = "https://mainnet.base.org"
CONFIRMATIONS = "12"
MAX_BLOCK_RANGE = "1500"
AI_MODEL = "gpt-4.1-mini"
