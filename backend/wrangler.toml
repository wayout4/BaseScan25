name = "basegrid-safety-api"
main = "backend/src/index.js"
compatibility_date = "2026-10-01"
workers_dev = true

[vars]
SITE_ORIGIN = "https://wayout4.github.io"
CONFIRMATIONS = "12"
MAX_BLOCK_RANGE = "1500"
AI_MODEL = "gpt-4.1-mini"

[[d1_databases]]
binding = "DB"
database_name = "basegrid-safety"
database_id = "REPLACE_WITH_D1_DATABASE_ID"

[triggers]
crons = ["* * * * *"]
