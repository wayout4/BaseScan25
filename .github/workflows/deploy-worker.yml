name: Deploy BaseGrid Safety API to Cloudflare
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate required deployment secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
          PAYMENT_RECIPIENT: ${{ secrets.PAYMENT_RECIPIENT }}
          ADMIN_SECRET: ${{ secrets.ADMIN_SECRET }}
        run: |
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID D1_DATABASE_ID PAYMENT_RECIPIENT ADMIN_SECRET; do
            if [ -z "${!name}" ]; then echo "Missing required GitHub Actions secret: $name"; exit 1; fi
          done
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Configure Wrangler
        env:
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
        run: |
          sed -i "s/REPLACE_WITH_D1_DATABASE_ID/$D1_DATABASE_ID/" wrangler.toml
          npm install --global wrangler
      - name: Initialize database schema
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: wrangler d1 execute basegrid-safety --remote --file=backend/schema.sql
      - name: Set required Worker secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PAYMENT_RECIPIENT: ${{ secrets.PAYMENT_RECIPIENT }}
          ADMIN_SECRET: ${{ secrets.ADMIN_SECRET }}
        run: |
          printf "%s" "$PAYMENT_RECIPIENT" | wrangler secret put PAYMENT_RECIPIENT
          printf "%s" "$ADMIN_SECRET" | wrangler secret put ADMIN_SECRET
      - name: Set optional email and AI secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          FROM_EMAIL: ${{ secrets.FROM_EMAIL }}
        run: |
          if [ -n "$RESEND_API_KEY" ]; then printf "%s" "$RESEND_API_KEY" | wrangler secret put RESEND_API_KEY; fi
          if [ -n "$OPENAI_API_KEY" ]; then printf "%s" "$OPENAI_API_KEY" | wrangler secret put OPENAI_API_KEY; fi
          if [ -n "$FROM_EMAIL" ]; then printf "%s" "$FROM_EMAIL" | wrangler secret put FROM_EMAIL; fi
      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: wrangler deploy
