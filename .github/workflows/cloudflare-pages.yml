name: Deploy BaseGrid 25 to Cloudflare Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cloudflare-pages
  cancel-in-progress: true
jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate HTML and inline JavaScript
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const cp = require('node:child_process');
          const html = fs.readFileSync('index.html', 'utf8');
          const required = ['<title>', 'id="grid"', 'id="search"', 'id="pay-button"', 'id="pay-section"', '0x1BD2a89E17c4d17F9bFc1757Bd9Cc299e6a0038E', '0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913'];
          for (const value of required) if (!html.includes(value)) throw new Error('Missing required page element/config: ' + value);
          const tokenBlock = html.match(/const TOKENS=\[(.*?)\];/s);
          if (!tokenBlock) throw new Error('Token list not found');
          const tokenCount = [...tokenBlock[1].matchAll(/\["[^"]+",\s*"0x[a-fA-F0-9]{40}"\]/g)].length;
          if (tokenCount !== 25) throw new Error('Expected 25 address entries; found ' + tokenCount);
          const scripts = [...html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)].map(m => m[1]).filter(s => s.trim());
          scripts.forEach((script, i) => {
            const path = '/tmp/basegrid-inline-' + i + '.js';
            fs.writeFileSync(path, script);
            const result = cp.spawnSync(process.execPath, ['--check', path], {encoding:'utf8'});
            if (result.status !== 0) throw new Error('Inline script syntax error: ' + (result.stderr || result.stdout));
          });
          console.log('Validated HTML essentials, 25 addresses, and ' + scripts.length + ' inline scripts.');
          NODE
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy . --project-name=basescan25 --branch=main
