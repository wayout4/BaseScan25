name: Publish BaseGrid 25 to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure API URL
        env:
          BASEGRID_API_URL: ${{ vars.BASEGRID_API_URL }}
        run: |
          BASEGRID_API_URL="${BASEGRID_API_URL:-https://basescan25.onrender.com}" node <<'NODE'
          const fs = require('node:fs');
          const api = process.env.BASEGRID_API_URL.replace(/\/$/, '');
          if (!/^https:\/\/[a-z0-9.-]+(?::[0-9]+)?$/i.test(api)) throw new Error('BASEGRID_API_URL must be an HTTPS origin without a path.');
          for (const file of ['index.html', 'safety.html']) {
            const html = fs.readFileSync(file, 'utf8');
            const updated = html.replace(/<meta name="basegrid-api" content="[^"]*">/, '<meta name="basegrid-api" content="' + api + '">');
            if (updated === html && !html.includes('content="' + api + '"')) throw new Error('Could not configure API URL in ' + file);
            fs.writeFileSync(file, updated);
          }
          console.log('Configured API origin:', api);
          NODE
      - name: Validate site content and JavaScript
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const cp = require('node:child_process');
          const html = fs.readFileSync('index.html', 'utf8');
          const safety = fs.readFileSync('safety.html', 'utf8');
          const backend = fs.readFileSync('backend/src/index.js', 'utf8');
          const schema = fs.readFileSync('backend/schema.postgres.sql', 'utf8');
          if (!schema.includes('CREATE TABLE IF NOT EXISTS orders') || !schema.includes('CREATE TABLE IF NOT EXISTS reports')) throw new Error('Backend database schema missing required tables.');
          const server = fs.readFileSync('backend/server.js', 'utf8');
          fs.writeFileSync('/tmp/basegrid-backend.mjs', backend);
          fs.writeFileSync('/tmp/basegrid-server.mjs', server);
          const serverCheck = cp.spawnSync(process.execPath, ['--check', '/tmp/basegrid-server.mjs'], {encoding:'utf8'});
          if (serverCheck.status !== 0) throw new Error('Node server JavaScript syntax error: ' + (serverCheck.stderr || serverCheck.stdout));
          const backendCheck = cp.spawnSync(process.execPath, ['--check', '/tmp/basegrid-backend.mjs'], {encoding:'utf8'});
          if (backendCheck.status !== 0) throw new Error('Backend JavaScript syntax error: ' + (backendCheck.stderr || backendCheck.stdout));
          if (!backend.includes('eth_getLogs') || !backend.includes('api.gopluslabs.io') || !backend.includes('api.rugcheck.xyz') || !backend.includes('api.resend.com')) throw new Error('Backend provider/payment/email integration missing.');
          for (const value of ['id="query"', 'id="chain"', 'id="scan"', 'api.gopluslabs.io', 'api.dexscreener.com', 'unknown']) if (!safety.includes(value)) throw new Error('Missing safety lab feature/config: ' + value);
          const required = ['<title>', 'id="grid"', 'id="search"', 'id="pay-button"', 'id="recipient"', 'id="payments"', '0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913', 'prefers-reduced-motion'];
          for (const value of required) if (!html.includes(value)) throw new Error('Missing required page element/config: ' + value);
          if (html.includes('0x1BD2a89E17c4d17F9bFc1757Bd9Cc299e6a0038E')) throw new Error('A hard-coded receiving address remains in the build.');
          const tokenBlock = html.match(/const TOKENS=\[(.*?)\];\nconst USDC=/s);
          if (!tokenBlock) throw new Error('Token list not found');
          const entries = [...tokenBlock[1].matchAll(/\["[^"]+",\s*"0x[a-fA-F0-9]{40}"\]/g)];
          if (entries.length !== 25) throw new Error('Expected 25 address entries; found ' + entries.length);
          const scripts = [...html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)].map(m => m[1]).filter(s => s.trim());
          const safetyScripts = [...safety.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)].map(m => m[1]).filter(s => s.trim());
          safetyScripts.forEach((script, i) => {
            const path = '/tmp/safety-inline-' + i + '.js';
            fs.writeFileSync(path, script);
            const result = cp.spawnSync(process.execPath, ['--check', path], {encoding:'utf8'});
            if (result.status !== 0) throw new Error('Safety lab inline script syntax error: ' + (result.stderr || result.stdout));
          });
          scripts.forEach((script, i) => {
            const path = '/tmp/basegrid-inline-' + i + '.js';
            fs.writeFileSync(path, script);
            const result = cp.spawnSync(process.execPath, ['--check', path], {encoding:'utf8'});
            if (result.status !== 0) throw new Error('Inline script syntax error: ' + (result.stderr || result.stdout));
          });
          for (const path of ['manifest.webmanifest', 'icon.svg', 'sw.js']) if (!fs.existsSync(path)) throw new Error('Missing app asset: ' + path);
          JSON.parse(fs.readFileSync('manifest.webmanifest', 'utf8'));
          console.log('Validated site, safety lab, PostgreSQL schema, Node server syntax, no embedded legacy recipient address, 25 contracts, app assets, and ' + (scripts.length + safetyScripts.length) + ' inline scripts.');
          NODE
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
