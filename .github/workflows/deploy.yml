name: Publish BaseScan25 to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure API URL
        env:
          BASEGRID_API_URL: ${{ vars.BASEGRID_API_URL }}
        run: |
          BASEGRID_API_URL="${BASEGRID_API_URL:-https://basescan25.onrender.com}" node <<'NODE'
          const fs = require('node:fs');
          const api = process.env.BASEGRID_API_URL.replace(/\/$/, '');
          if (!/^https:\/\/[a-z0-9.-]+(?::[0-9]+)?$/i.test(api)) throw new Error('BASEGRID_API_URL must be an HTTPS origin without a path.');
          for (const file of ['index.html', 'safety.html']) {
            const html = fs.readFileSync(file, 'utf8');
            const updated = html.replace(/<meta name="basegrid-api" content="[^"]*">/, '<meta name="basegrid-api" content="' + api + '">');
            if (updated === html && !html.includes('content="' + api + '"')) throw new Error('Could not configure API URL in ' + file);
            fs.writeFileSync(file, updated);
          }
          console.log('Configured API origin:', api);
          NODE
      - name: Validate site, backend and inline scripts
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const cp = require('node:child_process');
          const html = fs.readFileSync('index.html', 'utf8');
          const safety = fs.readFileSync('safety.html', 'utf8');
          const backend = fs.readFileSync('backend/src/index.js', 'utf8');
          const schema = fs.readFileSync('backend/schema.postgres.sql', 'utf8');
          const server = fs.readFileSync('backend/server.js', 'utf8');
          if (!schema.includes('CREATE TABLE IF NOT EXISTS orders') || !schema.includes('CREATE TABLE IF NOT EXISTS reports')) throw new Error('Backend database schema missing required tables.');
          for (const [name, source] of [['backend', backend], ['server', server]]) {
            const path = '/tmp/' + name + '.mjs';
            fs.writeFileSync(path, source);
            const result = cp.spawnSync(process.execPath, ['--check', path], {encoding:'utf8'});
            if (result.status !== 0) throw new Error(name + ' JavaScript syntax error: ' + (result.stderr || result.stdout));
          }
          if (!backend.includes('eth_getLogs') || !backend.includes('api.gopluslabs.io') || !backend.includes('api.rugcheck.xyz') || !backend.includes('api.resend.com') || !backend.includes('/api/stripe/checkout')) throw new Error('Backend provider/payment/email integration missing.');
          for (const value of ['<title>BaseScan25', 'id="scanForm"', 'id="checkoutForm"', 'Token Safety Brief', '$1.49', 'name="basegrid-api"', 'prefers-reduced-motion']) if (!html.includes(value)) throw new Error('Missing storefront feature/config: ' + value);
          for (const value of ['id="query"', 'id="chain"', 'id="scan"', 'api.gopluslabs.io', 'api.dexscreener.com', 'unknown']) if (!safety.includes(value)) throw new Error('Missing safety lab feature/config: ' + value);
          if (html.includes('sk_live_') || html.includes('whsec_') || html.includes('rk_live_')) throw new Error('A Stripe secret appears in public HTML.');
          const scripts = [...html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)].map(m => m[1]).filter(s => s.trim());
          const safetyScripts = [...safety.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)].map(m => m[1]).filter(s => s.trim());
          [...scripts.map((s,i)=>['storefront',s,i]), ...safetyScripts.map((s,i)=>['safety',s,i])].forEach(([name,script,i]) => {
            const path = '/tmp/' + name + '-inline-' + i + '.js';
            fs.writeFileSync(path, script);
            const result = cp.spawnSync(process.execPath, ['--check', path], {encoding:'utf8'});
            if (result.status !== 0) throw new Error(name + ' inline script syntax error: ' + (result.stderr || result.stdout));
          });
          for (const path of ['manifest.webmanifest', 'icon.svg', 'sw.js']) if (!fs.existsSync(path)) throw new Error('Missing app asset: ' + path);
          JSON.parse(fs.readFileSync('manifest.webmanifest', 'utf8'));
          console.log('Validated redesigned storefront, safety lab, PostgreSQL schema, backend syntax, public secret guard, app assets and inline scripts.');
          NODE
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
