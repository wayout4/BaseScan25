services:
  - type: web
    name: basescan25-api
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      # To fit workspaces at Render's 25-resource limit, reuse an existing
      # PostgreSQL database instead of provisioning a second Render resource.
      # Set this in Render to the existing database's INTERNAL connection URL.
      - key: DATABASE_URL
        sync: false
      - key: SITE_ORIGIN
        value: https://wayout4.github.io
      - key: BASE_RPC_URL
        value: https://mainnet.base.org
      - key: CONFIRMATIONS
        value: "12"
      - key: MAX_BLOCK_RANGE
        value: "1500"
      - key: VERIFIER_INTERVAL_SECONDS
        value: "60"
      - key: PAYMENT_RECIPIENT
        sync: false
      - key: ADMIN_SECRET
        generateValue: true
      - key: RESEND_API_KEY
        sync: false
      - key: FROM_EMAIL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
